name: Deploy Gh-Pages
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Full history: the sitemap's lastmod is the date of the last commit
          # touching src/ or public/, which a shallow clone cannot report.
          fetch-depth: 0

      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install
    
      - name: Build
        env:
          VITE_API_URL: https://api.voicey.fr
          VITE_DISCORD_CLIENT_ID: "1269350971570393251"
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/client
          cname: voicey.fr